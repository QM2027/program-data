name: Publish program data

# Fetches the program from Indico and deploys it to GitHub Pages under
# https://qm2027.github.io/program-data/ (start at index.json). Nothing is committed.
#
#   push / manual run  → always publish (use "Run workflow" right after editing the timetable)
#   schedule           → publish if the program changed, or hourly to refresh checkedAt
# A sudden large drop in contributions is never published; a manual run with "force" overrides it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if the program shrank a lot
        type: boolean
        default: false
  schedule:
    - cron: "23 */6 * * *"       # every 6 hours
    - cron: "*/5 * 15-28 3 *"    # every 5 minutes around the conference (15–28 March)

permissions:
  contents: read
  pages: write
  id-token: write

# Don't cancel: a run with nothing new must not cancel one that is publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: pages
        uses: actions/configure-pages@v5

      - run: node --test

      # The published snapshot is the previous one: it carries the change history and is kept
      # as-is if Indico can't be reached.
      - id: sync
        run: node scripts/sync.mjs
        env:
          PREVIOUS_URL: ${{ steps.pages.outputs.base_url }}
          FORCE: ${{ inputs.force || false }}
          # Settings → Secrets and variables → Actions → Variables → EVENT_ID. Unset means QM2027
          # (1622375). Set 1334113 to publish QM2025 for testing; the site labels any other event
          # as a preview. Changing it starts a fresh snapshot, since the event id differs.
          EVENT_ID: ${{ vars.EVENT_ID || '1622375' }}

      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          SYNC_PUBLISH: ${{ steps.sync.outputs.publish }}
        run: |
          if [ "$EVENT" = schedule ] && [ "$SYNC_PUBLISH" != true ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.decide.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
